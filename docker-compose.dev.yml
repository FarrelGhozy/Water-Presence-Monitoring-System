services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./python-worker:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - BUN_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/water-monitor-dev
      - GEE_WORKER_URL=http://python-worker:8000
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend/src:/app/src
      - backend_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
  backend_uploads:
