services:
  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      retries: 5

  python-worker:
    build:
      context: ./python-worker
      dockerfile: Dockerfile
    restart: always
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gee-service-account.json
      - EARTH_ENGINE_PROJECT=${EARTH_ENGINE_PROJECT}
    secrets:
      - gee_service_account

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BUN_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/water-monitor-prod
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - AI_MODEL=${AI_MODEL:-openrouter/owl-alpha}
      - GEE_WORKER_URL=http://python-worker:8000
      - CORS_ORIGINS=${CORS_ORIGINS:-https://water-presence.vercel.app}
    depends_on:
      mongodb:
        condition: service_healthy

secrets:
  gee_service_account:
    file: ./gee-service-account.json

volumes:
  mongo_data:
